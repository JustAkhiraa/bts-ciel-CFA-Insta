# Met à jour le planning publié, tout seul, régulièrement.
#
# Pourquoi ici et pas sur la machine : le site doit rester juste même quand
# l'ordinateur est éteint. Et pourquoi seulement le planning : le générateur
# vit dans le dépôt privé, qui n'est pas sur GitHub. Cette Action ne sait
# donc remplacer que ce qui vieillit : l'agenda, les semaines, le bandeau.
#
# L'API visée est l'affichage public du hall du CFA
# (https://connect.cfa-insta.fr/planning/) : son chemin contient « /public/ »
# et elle répond sans authentification.
#
# Le rythme vient du RELAIS (dernière étape) : chaque passage attend, puis
# lance lui-même le suivant. Toutes les 5 minutes le jeudi et le vendredi
# de 6 h à 19 h, toutes les 30 minutes les autres jours de 7 h à 20 h.
# Le départ à 7 h n'est pas un hasard : le premier passage programmé que
# GitHub lance le matin arrive vers 7 h 40. Plus tard, il arrêterait la
# chaîne au lieu de la démarrer.
name: Planning

on:
  schedule:
    # Ces créneaux ne servent plus qu'à démarrer la chaîne, ou à la relancer
    # si un passage a échoué. GitHub ne lance les passages programmés de ce
    # dépôt qu'environ trois fois par jour (vers 7 h 40, 17 h et 0 h 40 à
    # Paris, relevé du 2 au 16 nov. 2026), même les jours où il y en a un
    # toutes les cinq minutes.
    #
    # Les heures sont en UTC : GitHub ne connaît pas l'heure de Paris.
    # Elles sont calées sur l'heure d'hiver (Paris = UTC + 1).
    # À l'heure d'été (dès le 28 mars 2027), tout partirait une heure
    # plus tard : retirer 1 aux heures ci-dessous.
    # Les minutes ne sont pas rondes : à l'heure pile, GitHub est le plus
    # chargé, et la minute 43 est celle du robot Actu.

    # Jeudi et vendredi, de 6 h à 10 h : toutes les 5 minutes.
    - cron: "2-59/5 5-8 * * 4,5"

    # Jeudi et vendredi, de 10 h à 19 h : toutes les 8 minutes.
    - cron: "1-59/8 9-17 * * 4,5"

    # Du lundi au mercredi, de 9 h à 17 h : toutes les 2 heures.
    - cron: "2 8-16/2 * * 1-3"

    # Samedi et dimanche : une fois, vers 9 h.
    - cron: "17 8 * * 0,6"

  workflow_dispatch:        # Toujours disponible à la demande, depuis l'onglet Actions, et pour le relais

permissions:
  contents: write           # committer la mise à jour
  actions: write            # lancer le passage suivant (le relais)

# Un seul passage à la fois, et un seul en attente : si un passage programmé
# tombe pendant la chaîne, le relais le remplace. Deux chaînes ne peuvent
# donc pas tourner ensemble.
concurrency:
  group: planning
  cancel-in-progress: false

jobs:
  mettre-a-jour:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Récupérer le planning et réécrire ce qui vieillit
        run: python3 outillage/planning-ci.py 10

      # Le garde-fou passe APRÈS la mise à jour et AVANT le commit : c'est le
      # seul ordre qui empêche une donnée personnelle ou un lien mort de
      # partir en ligne. Si l'API se mettait un jour à renvoyer un nom de
      # professeur, la publication échouerait ici.
      - name: Vérifier avant de publier
        run: python3 verification/verifier.py

      - name: Committer s'il y a du changement
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Rien n'a changé : aucun commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Planning : mise à jour automatique"
          # Le robot Actu peut avoir poussé entre-temps : se remettre sur lui.
          # Si son envoi croise le nôtre, on réessaie (trois fois au plus).
          for essai in 1 2 3; do
            git pull --rebase && git push && exit 0
            sleep 5
          done
          exit 1

      # Le relais. GitHub interdit à un robot d'en déclencher un autre, sauf
      # par un lancement « à la demande », et ceux-là partent tout de suite.
      # La machine attend donc, puis lance le passage suivant. Les heures
      # sont celles de Paris, été comme hiver. Hors de ces heures, pas de
      # relais : le premier passage programmé suivant relance la chaîne.
      # Si une étape plus haut a échoué, celle-ci ne s'exécute pas : la
      # chaîne s'arrête au lieu d'échouer à chaque passage.
      - name: Passer le relais
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          jour=$(TZ=Europe/Paris date +%u)          # 1 = lundi, 7 = dimanche
          heure=$((10#$(TZ=Europe/Paris date +%H)))
          if [ "$jour" = 4 ] || [ "$jour" = 5 ]; then
            debut=6; fin=19; pause=270              # jeudi, vendredi : toutes les 5 minutes
          else
            debut=7; fin=20; pause=1770             # les autres jours : toutes les 30 minutes
          fi
          if [ "$heure" -lt "$debut" ] || [ "$heure" -ge "$fin" ]; then
            echo "Hors des heures du relais : la chaîne s'arrête jusqu'au prochain passage programmé."
            exit 0
          fi
          sleep "$pause"
          for essai in 1 2 3; do
            gh workflow run planning.yml --ref main && exit 0
            sleep 10
          done
          exit 1
