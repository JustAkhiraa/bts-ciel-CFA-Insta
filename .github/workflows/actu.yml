# Relève les titres de l'actualité tech, toutes les dix minutes de la journée.
#
# Pourquoi ici et pas dans la page : les flux RSS n'autorisent pas un
# navigateur à les lire depuis un autre site. C'est donc cette Action qui les
# lit, plusieurs fois par heure, et qui range les titres dans « actu/donnees/ ».
# La page ne lit que ces fichiers-là.
#
# Ce qui est gardé : le titre, l'adresse, la date et l'adresse de la
# vignette. Jamais le texte des articles.
#
# Le rythme vient du RELAIS (dernière étape) : chaque passage attend dix
# minutes, puis lance lui-même le suivant. La nuit, la chaîne ne s'arrête
# pas : elle dort jusqu'à 6 h, puis reprend toute seule.
name: Actu

on:
  schedule:
    # Un filet de sécurité, pas le moteur. GitHub ne lance les passages
    # programmés de ce dépôt que quand il veut : environ trois fois par jour
    # du 2 au 16 nov. 2026, et le 17 nov. pas avant 15 h. Ces créneaux ne
    # servent qu'à relancer la chaîne si quelqu'un l'a arrêtée.
    # Minutes en 3 : pas l'heure pile, la plus chargée, et la minute 43,
    # que planning.yml réserve au robot Actu, en fait partie.
    - cron: "3-59/10 5-22 * * *"

  workflow_dispatch:        # à la demande, depuis l'onglet Actions, et par le relais

permissions:
  contents: write           # committer le relevé
  actions: write            # lancer le passage suivant (le relais)

# Un seul passage à la fois, et un seul en attente : si un passage programmé
# tombe pendant la chaîne, le relais le remplace. Deux chaînes ne peuvent
# donc pas tourner ensemble.
concurrency:
  group: actu
  cancel-in-progress: false

jobs:
  relever:
    runs-on: ubuntu-latest
    # 6 heures au plus pour une machine GitHub : la pause de nuit (5 h 30)
    # plus le relevé y tiennent. Chaque étape a sa propre limite, plus courte.
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Relever les titres
        timeout-minutes: 10
        run: python3 outillage/actu.py

      # Le garde-fou passe APRÈS le relevé et AVANT le commit, comme pour le
      # planning : un titre qui porterait une adresse ou un numéro arrête tout.
      - name: Vérifier avant de publier
        timeout-minutes: 5
        run: python3 verification/verifier.py

      - name: Committer s'il y a du neuf
        timeout-minutes: 5
        run: |
          if [ -z "$(git status --porcelain actu/donnees)" ]; then
            echo "Rien de neuf : aucun commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add actu/donnees
          git commit -m "Actu : nouveaux titres"
          # Le robot du planning a pu passer entre-temps : on se remet derrière
          # lui. Si son envoi croise le nôtre, on réessaie (trois fois au plus).
          for essai in 1 2 3; do
            git pull --rebase && git push && exit 0
            sleep 5
          done
          exit 1

      # Le relais. GitHub interdit à un robot d'en déclencher un autre, sauf
      # par un lancement « à la demande », et ceux-là partent tout de suite.
      # La machine attend donc dix minutes, puis lance le passage suivant.
      # La nuit (de 23 h à 6 h, heure de Paris), elle dort jusqu'à 6 h, en
      # deux fois puisqu'une machine ne peut pas attendre plus de 6 heures :
      # 5 h 30 au plus, puis le passage suivant reprend le compte.
      # Le relais passe même si une étape plus haut a échoué : un flux en
      # panne ne doit pas tuer la chaîne. Pour l'arrêter : annuler le
      # passage en cours dans l'onglet Actions.
      - name: Passer le relais
        if: ${{ !cancelled() }}
        timeout-minutes: 335
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # L'heure de Paris, en minutes depuis minuit.
          h=$((10#$(TZ=Europe/Paris date +%H)))
          m=$((10#$(TZ=Europe/Paris date +%M)))
          maintenant=$((h * 60 + m))
          debut=$((6 * 60))
          fin=$((23 * 60))
          if [ "$maintenant" -ge "$debut" ] && [ "$maintenant" -lt "$fin" ]; then
            pause=540
          else
            if [ "$maintenant" -lt "$debut" ]; then cible=$debut; else cible=$((debut + 1440)); fi
            pause=$(( (cible - maintenant) * 60 ))
            if [ "$pause" -gt 19800 ]; then pause=19800; fi
            echo "Nuit à Paris : pause de $((pause / 60)) minutes avant le passage suivant."
          fi
          sleep "$pause"
          for essai in 1 2 3; do
            gh workflow run actu.yml --ref main && exit 0
            sleep 10
          done
          exit 1
