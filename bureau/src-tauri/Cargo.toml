[package]
name = "bts-ciel"
version = "0.1.0"
description = "Les fiches de révision du BTS CIEL, en application de bureau"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"

[profile.release]
# une application plus petite : on optimise la taille, on retire les symboles
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
