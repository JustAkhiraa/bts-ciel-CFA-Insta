<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CIEL — l'île | BTS CIEL</title>
<meta name="description" content="Les fiches du BTS CIEL sur une île qu'on explore : une place, un bâtiment par matière, un port. Tout y est dessiné pour ce site.">
<meta name="theme-color" content="#8FD3F4">
<link rel="icon" href="../assets/icone.svg">
<link rel="stylesheet" href="ile.css?v=307ddefc">
</head>
<body>

<canvas id="scene" aria-hidden="true"></canvas>

<noscript>
  <div class="secours">
    <h1>L'île a besoin de JavaScript</h1>
    <p>Les mêmes fiches se lisent sans lui, sur le site ordinaire.</p>
    <p><a href="../index.html">Aller au site</a></p>
  </div>
</noscript>

<!-- Le même filet que le village : un monde en trois dimensions ne doit
     jamais être la SEULE porte vers une fiche. -->
<div class="secours" id="secours" hidden>
  <h1>Ce navigateur ne peut pas afficher l'île</h1>
  <p>WebGL n'est pas disponible ici.</p>
  <p>Aucune importance : <strong>les fiches sont exactement les mêmes</strong>
     sur le site ordinaire, et il fonctionne partout.</p>
  <p><a href="../index.html">Aller au site</a></p>
</div>

<div class="chargement" id="chargement">
  <p>On lève l'ancre…</p>
</div>

<header class="hud hud-haut" id="hud" hidden>
  <a class="retour" href="../index.html" title="Revenir au site ordinaire">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M15 5l-7 7 7 7"/></svg>
    <span>Le site</span>
  </a>
  <p class="titre-monde">CIEL<span>— l'île</span></p>
  <a class="rond" href="../monde/index.html" title="Aller au village 3D"
     aria-label="Aller au village 3D">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M3 21h18M5 21V10l7-5 7 5v11M10 21v-6h4v6"/></svg>
  </a>
  <button type="button" id="btn-heure" class="rond" aria-label="Passer en nuit">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
         stroke-linecap="round" aria-hidden="true">
      <path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5z"/></svg>
  </button>
</header>

<!-- Les commandes, dites une fois. Elles s'effacent dès qu'on bouge :
     une aide qui reste à l'écran devient un meuble. -->
<p class="aide" id="aide">
  <kbd>Z</kbd><kbd>Q</kbd><kbd>S</kbd><kbd>D</kbd> ou les flèches pour marcher ·
  glisser pour tourner la vue
</p>

<!-- L'invite. Elle n'apparaît QUE devant une porte, et elle porte le nom
     du lieu : « Entrer » tout seul ne dit pas où l'on entre. C'est aussi un
     bouton — au doigt, il n'y a pas de touche E à presser. -->
<button type="button" class="invite" id="invite" hidden>
  <span class="invite-quoi" id="invite-quoi"></span>
  <kbd class="invite-touche">E</kbd>
</button>

<!-- LE CONTENU, EN HTML. La règle du village tient ici aussi : la 3D fait
     le décor, le HTML fait le contenu. Les liens d'une fiche doivent être
     de vrais liens — nets, sélectionnables, ouvrables dans un onglet, lus
     par un lecteur d'écran. Une liste rendue en texture n'est rien de tout
     ça. -->
<div class="dedans" id="dedans" hidden>
  <div class="dedans-feuille" role="dialog" aria-modal="true"
       aria-labelledby="dedans-titre">
    <header>
      <p class="dedans-sorte" id="dedans-sorte"></p>
      <h1 id="dedans-titre"></h1>
      <button type="button" class="dedans-sortir" id="dedans-sortir">
        Sortir <kbd>Échap</kbd>
      </button>
    </header>
    <div class="dedans-corps" id="dedans-corps"></div>
  </div>
</div>

<!-- Le manche tactile : sur un téléphone, il n'y a pas de clavier, et
     c'est sur un téléphone que ce site est le plus lu. -->
<div class="manche" id="manche" aria-hidden="true"><span></span></div>

<script type="module" src="ile.js?v=307ddefc"></script>
</body>
</html>
